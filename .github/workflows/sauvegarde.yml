# Weekly copy of the recipe book into backup/ (Monday morning, Montréal), also runnable by hand from the Actions tab.
# Reading the book also keeps the free Supabase project from pausing for inactivity.
# Also runs when this file changes, so a new version of it is tried right away.
name: Sauvegarde des recettes
on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/sauvegarde.yml]
permissions:
  contents: write
jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/backup-recipes.ts
      - name: Enregistrer la sauvegarde si elle a changé
        run: |
          git config user.name "sauvegarde-recettes"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backup
          git diff --cached --quiet || (git commit -m "Sauvegarde hebdomadaire des recettes" && git push)
